# Render.com blueprint — deploy ListingForge with zero terminal work.
# Render builds the frontend itself on every deploy, so nothing depends on
# a pre-built dist/ folder surviving file transfers.
services:
  - type: web
    name: listingforge
    runtime: python
    plan: starter            # $7/mo: always-on + persistent disk
    buildCommand: >
      cd frontend && npm install && npm run build && cd ../backend &&
      pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: listingforge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/listingforge.db
      - key: LF_STORAGE_DIR
        value: /var/data/storage
      - key: ANTHROPIC_API_KEY
        sync: false          # you enter this in the Render dashboard
      - key: FAL_KEY
        sync: false
      - key: ETSY_API_KEY
        sync: false
      - key: ETSY_REDIRECT_URI
        sync: false
