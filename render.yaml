# Render.com blueprint — deploy ListingForge with zero terminal work.
# The frontend ships pre-built (frontend/dist), so this is a pure Python deploy.
services:
  - type: web
    name: listingforge
    runtime: python
    plan: starter            # $7/mo: always-on + persistent disk
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: listingforge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/listingforge.db
      - key: LF_STORAGE_DIR
        value: /var/data/storage
      - key: ANTHROPIC_API_KEY
        sync: false          # you enter this in the Render dashboard
      - key: FAL_KEY
        sync: false
      - key: ETSY_API_KEY
        sync: false
      - key: ETSY_REDIRECT_URI
        sync: false
